<div class="header">
  <div style="display: flex; justify-content: space-between; align-items: center;">
    <div class="logo-section">
      <div class="logo-icon">📋</div>
      <div class="logo-text">JobBee</div>
    </div>

    <div *ngIf="message === 'company-info'" class="progress-item">
      <div class="progress-header">
        <span class="progress-label">Profile Setup</span>
        <span class="progress-status">0% Completed</span>
      </div>
      <div class="progress-bar-container">
        <div class="progress-bar progress-0"></div>
      </div>
    </div>

    <div *ngIf="message === 'founding-info'" class="progress-item">
      <div class="progress-header">
        <span class="progress-label">Profile Setup</span>
        <span class="progress-status">25% Completed</span>
      </div>
      <div class="progress-bar-container">
        <div class="progress-bar progress-25"></div>
      </div>
    </div>

    <div *ngIf="message === 'social-info'" class="progress-item">
      <div class="progress-header">
        <span class="progress-label">Profile Setup</span>
        <span class="progress-status">50% Completed</span>
      </div>
      <div class="progress-bar-container">
        <div class="progress-bar progress-50"></div>
      </div>
    </div>

    <div *ngIf="message === 'contact-info'" class="progress-item">
      <div class="progress-header">
        <span class="progress-label">Profile Setup</span>
        <span class="progress-status">75% Completed</span>
      </div>
      <div class="progress-bar-container">
        <div class="progress-bar progress-75"></div>
      </div>
    </div>

    <div *ngIf="message === 'complete-setup'" class="progress-item">
      <div class="progress-header">
        <span class="progress-label">Profile Setup</span>
        <span class="progress-status">100% Completed</span>
      </div>
      <div class="progress-bar-container">
        <div class="progress-bar progress-100"></div>
      </div>
    </div>

  </div>
</div>

<div class="tabs">
  <a class="tab" [ngClass]="{ 'active': message === 'company-info' }">
    <div class="tab-icon"></div>
    Company Info
  </a>
  <a class="tab" [ngClass]="{ 'active': message === 'founding-info' }">
    <div class="tab-icon"></div>
    Founding Info
  </a>
  <a class="tab" [ngClass]="{ 'active': message === 'social-info' }">
    <div class="tab-icon"></div>
    Social Media Profile
  </a>
  <a class="tab" [ngClass]="{ 'active': message === 'contact-info' }">
    <div class="tab-icon"></div>
    Contact
  </a>
  <a class="tab" [ngClass]="{ 'active': message === 'complete-setup' }">
    <div class="tab-icon"></div>
    Complete
  </a>
</div>

<div class="container">
  <form id="companyForm">
    <div class="upload-section">
      <h2 class="section-title">{{ 'upload.sectionTitle' | translate }}</h2>
      <div class="upload-grid">
        <div class="upload-item">
          <h3>{{ 'upload.uploadDocument' | translate }}</h3>
          <div class="upload-box" onclick="document.getElementById('logo-upload').click()">
            <div class="upload-icon">📤</div>
            <div class="upload-text" [innerHTML]="'upload.browseOrDrag' | translate"></div>
            <div class="upload-hint">
              {{ 'upload.logoHint' | translate }}
            </div>
          </div>
          <input type="file" id="logo-upload" style="display: none;" accept="image/*">
        </div>

        <div class="upload-item">
          <h3>{{ 'upload.uploadImage' | translate }}</h3>
          <div class="upload-box" onclick="document.getElementById('banner-upload').click()">
            <div class="upload-icon">📤</div>
            <div class="upload-text" [innerHTML]="'upload.browseOrDrag' | translate"></div>
            <div class="upload-hint">
              {{ 'upload.bannerHint' | translate }}
            </div>
          </div>
          <input type="file" id="banner-upload" style="display: none;" accept="image/*">
        </div>
      </div>
    </div>

    <!-- Buttons -->
    <div class="button-container">
      <button (click)="emitMessagePrevious()" type="button" class="btn btn-secondary">
        {{ 'buttons.previous' | translate }}
      </button>
      <button (click)="emitMessageNext()" type="button" class="btn btn-primary">
        {{ 'buttons.saveNext' | translate }}
      </button>
    </div>
  </form>
</div>

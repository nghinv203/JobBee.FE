<div>
  <div class="container">
    <div class="register normal-bg">
      <div class="register-content">
        <h4>{{ 'global.callRegister.becomeCandidate.title' | translate }}</h4>
        <p>{{ 'global.callRegister.becomeCandidate.description' | translate }}</p>
      </div>
      <button nz-button [nzSize]="'large'" class="register-btn">
        <div class="btn-content">
          <span>{{ 'global.callRegister.btn' | translate }}</span>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g id="fi:arrow-right">
              <path id="Vector" d="M5 12H19" stroke="#0A65CC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path id="Vector_2" d="M12 5L19 12L12 19" stroke="#0A65CC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
          </svg>
        </div>
      </button>
    </div>
    <div class="register primary-bg">
      <div class="register-content">
        <h4>{{ 'global.callRegister.becomeEmployer.title' | translate }}</h4>
        <p>{{ 'global.callRegister.becomeEmployer.description' | translate }}</p>
      </div>
      <button nz-button [nzSize]="'large'" class="register-btn">
        <div class="btn-content">
          <span>{{ 'global.callRegister.btn' | translate }}</span>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g id="fi:arrow-right">
              <path id="Vector" d="M5 12H19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path id="Vector_2" d="M12 5L19 12L12 19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
          </svg>
        </div>
      </button>
    </div>
  </div>
</div>

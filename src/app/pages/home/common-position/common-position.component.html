<div class="container">
  <div class="title">
    <h2>{{ 'global.commonPosition.title' | translate }}</h2>
  </div>
  <div class="common-position">
    @for(position of commonPosition; track position) {
      <div class="position">
        <div class="text-bold">{{position.title}}</div>
        <div class="text-thin">{{position.applicationsCount | number}}</div>
      </div>
    }
  </div>
</div>

<div class="review d-flex flex-column justify-content-between">
  <div>
    <div class="stars">
      @for(star of [1, 2, 3, 4, 5]; track star) {
        @if (star <= review.stars!) {
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28" fill="none">
            <path d="M12.9241 4.51345C13.3643 3.62165 14.636 3.62165 15.0762 4.51345L17.3262 9.07174C17.5009 9.42555 17.8383 9.6709 18.2287 9.72797L23.2623 10.4637C24.2462 10.6075 24.6383 11.8169 23.926 12.5107L20.2856 16.0564C20.0026 16.3321 19.8734 16.7295 19.9402 17.1189L20.7991 22.1266C20.9672 23.107 19.9382 23.8546 19.0578 23.3916L14.5587 21.0256C14.209 20.8417 13.7913 20.8417 13.4416 21.0256L8.94252 23.3916C8.06217 23.8546 7.03311 23.107 7.20125 22.1266L8.06013 17.1189C8.12693 16.7295 7.99773 16.3321 7.71468 16.0564L4.07431 12.5107C3.362 11.8169 3.75414 10.6075 4.73804 10.4637L9.7716 9.72797C10.162 9.6709 10.4995 9.42555 10.6741 9.07174L12.9241 4.51345Z" fill="#FFAA00"/>
          </svg>
        }
      }
    </div>
    <div class="feedback">
      <p>{{review.description}}</p>
    </div>
  </div>
  <div class="d-flex align-items-center justify-content-between">
    <div class="d-flex align-items-center">
      <div class="user-image me-2">
        <img [src]="review.user?.img" alt="">
      </div>
      <div>
        <div class="full-name">
          {{review.user?.fullName}}
        </div>
        <div class="position">
          {{review.user?.position}}
        </div>
      </div>
    </div>
    <div class="quote">
      <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
        <path fill-rule="evenodd" clip-rule="evenodd" d="M22 34C22 36.1217 21.1571 38.1566 19.6569 39.6569C18.1566 41.1571 16.1217 42 14 42C11.8783 42 9.84344 41.1571 8.34315 39.6569C6.84285 38.1566 6 36.1217 6 34C6 29.58 14 6 14 6H18L14 26C16.1217 26 18.1566 26.8429 19.6569 28.3431C21.1571 29.8434 22 31.8783 22 34ZM42 34C42 36.1217 41.1571 38.1566 39.6569 39.6569C38.1566 41.1571 36.1217 42 34 42C31.8783 42 29.8434 41.1571 28.3431 39.6569C26.8429 38.1566 26 36.1217 26 34C26 29.58 34 6 34 6H38L34 26C36.1217 26 38.1566 26.8429 39.6569 28.3431C41.1571 29.8434 42 31.8783 42 34Z" fill="#DADDE6"/>
      </svg>
    </div>
  </div>
</div>

@if(isAddResume){
  <app-add-resume></app-add-resume>
}

<div class="content">
  <h2 class="section-title">Basic Information</h2>

  <div class="form-grid">
    <div class="profile-picture">
      <label class="form-label">Profile Picture</label>
      <div class="upload-area">
        <svg class="upload-icon" viewBox="0 0 24 24">
          <path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/>
        </svg>
        <div class="upload-text">Browse photo or drop here</div>
        <div class="upload-subtext">A photo larger than 400 pixels work best. Max photo size 5 MB.</div>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Full name</label>
      <input type="text" class="form-input" placeholder="Enter your full name">
    </div>

    <div class="form-group">
      <label class="form-label">Title/headline</label>
      <input type="text" class="form-input" placeholder="Enter your title">
    </div>

    <div class="form-group">
      <label class="form-label">Title/headline</label>
      <input type="text" class="form-input" placeholder="Enter your title">
    </div>

    <div class="form-group">
      <label class="form-label">Title/headline</label>
      <input type="text" class="form-input" placeholder="Enter your title">
    </div>

    <div class="form-group">
      <label class="form-label">Experience</label>
      <select class="form-select">
        <option>Select...</option>
        <option>0-1 years</option>
        <option>1-3 years</option>
        <option>3-5 years</option>
        <option>5+ years</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">Educations</label>
      <select class="form-select">
        <option>Select...</option>
        <option>High School</option>
        <option>Bachelor's Degree</option>
        <option>Master's Degree</option>
        <option>PhD</option>
      </select>
    </div>


  </div>

  <button class="save-button">Save Changes</button>
</div>

<div class="cv-section">
  <h2 class="section-title">Your Cv/Resume</h2>

  <div class="cv-grid">
    <div class="cv-item">
      <div class="cv-header">
        <div class="cv-info">
          <div class="cv-icon">
            <svg viewBox="0 0 24 24">
              <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 2 2h8c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
            </svg>
          </div>
          <div class="cv-details">
            <h3>Professional Resume</h3>
            <p>3.5 MB</p>
          </div>
        </div>
        <button class="cv-menu" onclick="toggleDropdown(this)">
          <svg viewBox="0 0 24 24">
            <path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
          </svg>
        </button>
        <div class="dropdown">
          <button class="cv-action edit">
            <svg viewBox="0 0 24 24">
              <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
            </svg>
            Edit Resume
          </button>
          <button class="cv-action delete">
            <svg viewBox="0 0 24 24">
              <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
            </svg>
            Delete
          </button>
        </div>
      </div>
    </div>

    <div class="cv-item">
      <div class="cv-header">
        <div class="cv-info">
          <div class="cv-icon">
            <svg viewBox="0 0 24 24">
              <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 2 2h8c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>

            </svg>
            Edit Resume

            </svg>
            Delete
          </button>
        </div>
      </div>
    </div>

    <div class="cv-item">
      <div class="cv-header">
        <div class="cv-info">
          <div class="cv-icon">
            <svg viewBox="0 0 24 24">
              <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 2 2h8c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
            </svg>
          </div>
          <div class="cv-details">

              <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
            </svg>

        </div>

    <div (click)="openAddResume()" class="add-cv">

        <svg viewBox="0 0 24 24">
          <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>

  </div>
</div>

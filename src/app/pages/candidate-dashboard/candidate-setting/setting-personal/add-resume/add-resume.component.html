<!-- HTML Template -->
<div class="backdrop" id="backdrop"></div>
<dialog open id="dialogBox" class="dialog-box">
  <div class="popup-overlay">
    <div class="popup-container">
      <!-- Modal Header -->
      <div class="modal-header">
        <h2 class="modal-title">{{ 'modal.addCvTitle' | translate }}</h2>
        <button (click)="closePopUp()" type="button" class="close-button">×</button>
      </div>

      <form>
        <!-- CV/Resume Name Field -->
        <div class="form-group">
          <label>{{ 'modal.resumeNameLabel' | translate }}</label>
          <input
            type="text"
            placeholder="{{ 'modal.resumeNamePlaceholder' | translate }}">
        </div>

        <!-- File Upload Section -->
        <div class="form-group">
          <label>{{ 'modal.uploadLabel' | translate }}</label>
          <div class="upload-area">

            <div class="upload-icon" >📄</div>
            <div class="upload-text" >{{ 'modal.uploadText' | translate }}</div>
            <div class="upload-subtext">{{ 'modal.uploadSubtext' | translate }}</div>

            <input
              type="file"
              (change)="onFileSelected($event)"
              class="file-input">
          </div>
        </div>

        <!-- Button Group -->
        <div class="button-group">
          <button (click)="closePopUp()" type="button" class="btn-cancel">{{ 'modal.cancelButton' | translate }}</button>
          <button type="submit" class="btn-submit">{{ 'modal.submitButton' | translate }}</button>
        </div>
      </form>
    </div>
  </div>
</dialog>

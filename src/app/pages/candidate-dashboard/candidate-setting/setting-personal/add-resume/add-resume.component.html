<!-- HTML Template -->
<div class="backdrop" id="backdrop"></div>
<dialog open id="dialogBox" class="dialog-box">
  <div class="popup-overlay">
    <div class="popup-container">
      <!-- Modal Header -->
      <div class="modal-header">
        <h2 class="modal-title">Add Cv/Resume</h2>
        <button (click)="closePopUp()" type="button" class="close-button">×</button>
      </div>

      <form>
        <!-- CV/Resume Name Field -->
        <div class="form-group">
          <label>Cv/Resume Name</label>
          <input
            type="text"
            placeholder="Enter resume name">
        </div>

        <!-- File Upload Section -->
        <div class="form-group">
          <label>Upload your Cv/Resume</label>
          <div class="upload-area">

            <div class="upload-icon" >📄</div>
            <div class="upload-text" >Browse File or drop here</div>
            <div class="upload-subtext">Max file size 12 MB</div>

            <input
              type="file"
              class="file-input">
          </div>
        </div>

        <!-- Button Group -->
        <div class="button-group">
          <button (click)="closePopUp()" type="button" class="btn-cancel">Cancel</button>
          <button type="submit" class="btn-submit">Add Cv/Resume</button>
        </div>
      </form>
    </div>
  </div>
</dialog>

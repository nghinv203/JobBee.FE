<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<div class="container">
  <!-- Privacy Settings Section -->
  <div class="section">
    <div class="privacy-controls">
      <div class="privacy-item">
        <div class="privacy-label">{{ 'accountSettings.privacy.isAvailable' | translate }}</div>
        <label class="toggle-switch">
          <input type="checkbox">
          <span class="slider"></span>
        </label>
      </div>
    </div>
  </div>

  <!-- Change Password Section -->
  <form (ngSubmit)="onChangePassword()" #changeForm="ngForm" class="section">
    <h2 class="section-title">{{ 'accountSettings.changePassword.title' | translate }}</h2>

    <div class="password-row">
      <div class="form-group">
        <label class="form-label">{{ 'accountSettings.changePassword.current' | translate }}</label>
        <div class="input-group">
          <input
            [type]="showCurrent ? 'text' : 'password'"
            class="form-input"
            placeholder="{{ 'accountSettings.changePassword.placeholderCurrent' | translate }}"
            id="current-password"
            name="oldPassword"
            required
            [(ngModel)]="oldPassword">
          <button type="button" class="toggle-password" (click)="showCurrent = !showCurrent">
            <i class="fas" [ngClass]="showCurrent ? 'fa-eye-slash' : 'fa-eye'"></i>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">{{ 'accountSettings.changePassword.new' | translate }}</label>
        <div class="input-group">
          <input
            [type]="showNew ? 'text' : 'password'"
            class="form-input"
            placeholder="{{ 'accountSettings.changePassword.placeholderNew' | translate }}"
            id="new-password"
            name="password"
            required
            [(ngModel)]="password">
          <button type="button" class="toggle-password" (click)="showNew = !showNew">
            <i class="fas" [ngClass]="showNew ? 'fa-eye-slash' : 'fa-eye'"></i>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">{{ 'accountSettings.changePassword.confirm' | translate }}</label>
        <div class="input-group">
          <input
            [type]="showConfirm ? 'text' : 'password'"
            class="form-input"
            placeholder="{{ 'accountSettings.changePassword.placeholderConfirm' | translate }}"
            id="confirm-password"
            name="confirmPassword"
            required
            [(ngModel)]="confirmPassword">
          <button type="button" class="toggle-password" (click)="showConfirm = !showConfirm">
            <i class="fas" [ngClass]="showConfirm ? 'fa-eye-slash' : 'fa-eye'"></i>
          </button>
        </div>
      </div>
    </div>

    <button type="submit" class="btn btn-primary">
      <i class="fas fa-save"></i>
      {{ 'accountSettings.changePassword.saveChanges' | translate }}
    </button>
  </form>

  <!-- Delete Account Section -->
  <div class="section">
    <h2 class="section-title">{{ 'accountSettings.deleteAccount.title' | translate }}</h2>
    <div class="delete-section">
      <p class="delete-warning">
        {{ 'accountSettings.deleteAccount.warning' | translate }}
      </p>
      <button class="btn btn-danger">
        <i class="fas fa-trash-alt"></i>
        {{ 'accountSettings.deleteAccount.button' | translate }}
      </button>
    </div>
  </div>
</div>

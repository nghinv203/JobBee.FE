<div class="content">

  <!-- BASIC INFORMATION -->
  <h2 class="section-title">{{ 'profileDetail.basicInfo' | translate }}</h2>
  <div class="form-grid">
    <div class="form-group">
      <label class="form-label">{{ 'profileDetail.firstName' | translate }}</label>
      <input type="text" class="form-input" placeholder="{{ 'profileDetail.firstNamePlaceholder' | translate }}">
    </div>

    <div class="form-group">
      <label class="form-label">{{ 'profileDetail.lastName' | translate }}</label>
      <input type="text" class="form-input" placeholder="{{ 'profileDetail.lastNamePlaceholder' | translate }}">
    </div>

    <div class="form-group">
      <label class="form-label">{{ 'profileDetail.dateOfBirth' | translate }}</label>
      <input type="date" class="form-input">
    </div>

    <div class="form-group">
      <label class="form-label">{{ 'profileDetail.gender' | translate }}</label>
      <select class="form-select">
        <option>{{ 'profileDetail.genderPlaceholder' | translate }}</option>
        <option>{{ 'profileDetail.genderMale' | translate }}</option>
        <option>{{ 'profileDetail.genderFemale' | translate }}</option>
        <option>{{ 'profileDetail.genderOther' | translate }}</option>
        <option>{{ 'profileDetail.genderPreferNot' | translate }}</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">{{ 'profileDetail.headline' | translate }}</label>
      <input type="text" class="form-input" placeholder="{{ 'profileDetail.headlinePlaceholder' | translate }}">
    </div>

    <div class="form-group">
      <label class="form-label">{{ 'profileDetail.summary' | translate }}</label>
      <textarea class="form-input" rows="3" placeholder="{{ 'profileDetail.summaryPlaceholder' | translate }}"></textarea>
    </div>

    <div class="form-group">
      <label class="form-label">{{ 'profileDetail.experience' | translate }}</label>
      <input type="number" class="form-input" placeholder="{{ 'profileDetail.experiencePlaceholder' | translate }}">
    </div>

    <div class="form-group">
      <label class="form-label">{{ 'profileDetail.currentSalary' | translate }}</label>
      <input type="number" class="form-input" placeholder="{{ 'profileDetail.currentSalaryPlaceholder' | translate }}">
    </div>

    <div class="form-group">
      <label class="form-label">{{ 'profileDetail.expectedSalary' | translate }}</label>
      <input type="number" class="form-input" placeholder="{{ 'profileDetail.expectedSalaryPlaceholder' | translate }}">
    </div>
  </div>

  <!-- CONTACT INFORMATION -->
  <h2 class="section-title">{{ 'profileDetail.contactInfo' | translate }}</h2>
  <div class="form-grid">
    <div class="form-group">
      <label class="form-label">{{ 'profileDetail.phoneNumber' | translate }}</label>
      <input type="tel" class="form-input" placeholder="{{ 'profileDetail.phoneNumberPlaceholder' | translate }}">
    </div>

    <div class="form-group">
      <label class="form-label">{{ 'profileDetail.address' | translate }}</label>
      <input type="text" class="form-input" placeholder="{{ 'profileDetail.addressPlaceholder' | translate }}">
    </div>

    <div class="form-group">
      <label class="form-label">{{ 'profileDetail.country' | translate }}</label>
      <select class="form-select" id="country">
        <option>{{ 'profileDetail.countryPlaceholder' | translate }}</option>
        <option value="us">United States</option>
        <option value="vn">Vietnam</option>
        <option value="jp">Japan</option>
        <option value="uk">United Kingdom</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">{{ 'profileDetail.state' | translate }}</label>
      <select class="form-select" id="state">
        <option>{{ 'profileDetail.statePlaceholder' | translate }}</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">{{ 'profileDetail.city' | translate }}</label>
      <select class="form-select" id="city">
        <option>{{ 'profileDetail.cityPlaceholder' | translate }}</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">{{ 'profileDetail.postalCode' | translate }}</label>
      <input type="text" class="form-input" placeholder="{{ 'profileDetail.postalCodePlaceholder' | translate }}">
    </div>
  </div>

  <!-- BUTTON -->
  <div style="margin-top: 2rem;">
    <button class="save-button">{{ 'profileDetail.saveChanges' | translate }}</button>
  </div>
</div>

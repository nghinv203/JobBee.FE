<div class="content">

  <!-- BASIC INFORMATION -->
  <h2 class="section-title">Basic Information</h2>
  <div class="form-grid">
    <div class="form-group">
      <label class="form-label">First Name</label>
      <input type="text" class="form-input" placeholder="Enter your first name">
    </div>

    <div class="form-group">
      <label class="form-label">Last Name</label>
      <input type="text" class="form-input" placeholder="Enter your last name">
    </div>

    <div class="form-group">
      <label class="form-label">Date of Birth</label>
      <input type="date" class="form-input">
    </div>

    <div class="form-group">
      <label class="form-label">Gender</label>
      <select class="form-select">
        <option>Select gender...</option>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
        <option>Prefer not to say</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">Headline</label>
      <input type="text" class="form-input" placeholder="Your title/headline">
    </div>

    <div class="form-group">
      <label class="form-label">Summary</label>
      <textarea class="form-input" rows="3" placeholder="Tell us a bit about yourself..."></textarea>
    </div>

    <div class="form-group">
      <label class="form-label">Years of Experience</label>
      <input type="number" class="form-input" placeholder="e.g. 3">
    </div>

    <div class="form-group">
      <label class="form-label">Current Salary ($)</label>
      <input type="number" class="form-input" placeholder="e.g. 50000">
    </div>

    <div class="form-group">
      <label class="form-label">Salary Expectation ($)</label>
      <input type="number" class="form-input" placeholder="e.g. 60000">
    </div>
  </div>

  <!-- CONTACT INFORMATION -->
  <h2 class="section-title">Contact Information</h2>
  <div class="form-grid">
    <div class="form-group">
      <label class="form-label">Phone Number</label>
      <input type="tel" class="form-input" placeholder="e.g. +1 123 456 7890">
    </div>

    <div class="form-group">
      <label class="form-label">Address</label>
      <input type="text" class="form-input" placeholder="Street address">
    </div>

    <div class="form-group">
      <label class="form-label">Country</label>
      <select class="form-select" id="country">
        <option>Select a country...</option>
        <option value="us">United States</option>
        <option value="vn">Vietnam</option>
        <option value="jp">Japan</option>
        <option value="uk">United Kingdom</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">State/Province</label>
      <select class="form-select" id="state">
        <option>Select a state...</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">City</label>
      <select class="form-select" id="city">
        <option>Select a city...</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">Postal Code</label>
      <input type="text" class="form-input" placeholder="Postal Code">
    </div>
  </div>

  <!-- BUTTON -->
  <div style="margin-top: 2rem;">
    <button class="save-button">Save Changes</button>
  </div>
</div>

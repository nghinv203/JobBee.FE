
@if(isAddExperience){
  <app-add-experience (isOpenMessage) = handlePopUp($event)></app-add-experience>
}
<div class="container">
  <div class="header">
    <div class="header-left">
      <h1>Education Records <span class="count">(1)</span></h1>
    </div>
    <button (click)="openAddExperience()" class="add-btn">
      <span class="add-icon">+</span>
      Add Education
    </button>
  </div>

  <div class="table-header">
    <div>EDUCATION</div>
    <div>PERIOD</div>
    <div>STATUS</div>
    <div>ACTION</div>
  </div>

  <div class="education-list" id="educationList">
    <div class="education-item">
      <div class="education-info">
        <div class="education-icon"></div>
        <div class="education-details">
          <h3>Computer Science <span class="education-type type-completed">Complete</span></h3>
          <div class="education-meta">
                                <span class="institution">
                                    <svg class="location-icon" fill="currentColor" viewBox="0 0 20 20">
                                        <path d="M10.394 2.08a1 1 0 00-.788 0l-7 3a1 1 0 000 1.84L5.25 8.051a.999.999 0 01.356-.257l4-1.714a1 1 0 11.788 1.838L7.667 9.088l1.94.831a1 1 0 00.787 0l7-3a1 1 0 000-1.838l-7-3zM3.31 9.397L5 10.12v4.102a8.969 8.969 0 00-1.05-.174 1 1 0 01-.89-.89 11.115 11.115 0 01.25-3.762zM9.3 16.573A9.026 9.026 0 007 14.935v-3.957l1.818.78a3 3 0 002.364 0l5.508-2.361a11.026 11.026 0 01.25 3.762 1 1 0 01-.89.89 8.968 8.968 0 00-5.35 2.524 1 1 0 01-1.4 0zM6 18a1 1 0 001-1v-2.065a8.935 8.935 0 00-2-.712V17a1 1 0 001 1z"/>
                                    </svg>
                                    Bachelor's Degree
                                </span>
            <span class="level">
                                    <svg class="level-icon" fill="currentColor" viewBox="0 0 20 20">
                                        <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                    </svg>

                                </span>
          </div>
        </div>
      </div>
      <div class="date-period">2020 - 2024</div>
      <div class="status active">
        <div class="status-icon"></div>
        Active
      </div>
      <button class="btn btn-danger">Delete</button>
    </div>
  </div>
</div>

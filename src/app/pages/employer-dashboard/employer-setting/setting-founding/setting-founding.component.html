<div class="container">
  <form id="companyForm">
    <!-- First row: Organization Type, Industry Types, Team Size -->
    <div class="form-row">
      <div class="form-group">
        <label for="industry-types">{{ 'foundingForm.industryTypes' | translate }}</label>
        <select id="industry-types" name="industry-types">
          <option value="">{{ 'foundingForm.select' | translate }}</option>
          <option value="technology">Technology</option>
          <option value="healthcare">Healthcare</option>
          <option value="finance">Finance</option>
          <option value="education">Education</option>
          <option value="retail">Retail</option>
          <option value="manufacturing">Manufacturing</option>
          <option value="consulting">Consulting</option>
          <option value="media">Media & Entertainment</option>
          <option value="real-estate">Real Estate</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label for="team-size">{{ 'foundingForm.teamSize' | translate }}</label>
        <select id="team-size" name="team-size">
          <option value="">{{ 'foundingForm.select' | translate }}</option>
          <option value="1-10">1-10 employees</option>
          <option value="11-50">11-50 employees</option>
          <option value="51-200">51-200 employees</option>
          <option value="201-500">201-500 employees</option>
          <option value="501-1000">501-1000 employees</option>
          <option value="1000+">1000+ employees</option>
        </select>
      </div>
    </div>

    <!-- Second row: Year of Establishment, Company Website -->
    <div class="form-row two-columns">
      <div class="form-group">
        <label for="establishment-year">{{ 'foundingForm.establishmentYear' | translate }}</label>
        <div class="date-input">
          <input type="date" id="establishment-year" name="establishment-year" placeholder="{{ 'foundingForm.datePlaceholder' | translate }}">
        </div>
      </div>

      <div class="form-group">
        <label for="company-website">{{ 'foundingForm.companyWebsite' | translate }}</label>
        <div class="website-input">
          <input type="url" id="company-website" name="company-website" placeholder="{{ 'foundingForm.websitePlaceholder' | translate }}">
        </div>
      </div>
    </div>

    <!-- Buttons -->
    <div class="button-container">
      <button type="button" class="btn btn-primary">{{ 'foundingForm.saveButton' | translate }}</button>
    </div>
  </form>
</div>

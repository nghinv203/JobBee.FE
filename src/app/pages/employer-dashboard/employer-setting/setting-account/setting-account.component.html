<div class="container">
  <!-- Contact Information Section -->
  <div class="section">
    <h2 class="section-title">{{ 'employer-db.account.contactInfoTitle' | translate }}</h2>

    <div class="form-row three-columns">
      <div class="form-group">
        <label for="city">{{ 'employer-db.account.cityLabel' | translate }}</label>
        <select id="city" name="industry-types">
          <option value="">{{ 'employer-db.account.citySelectPlaceholder' | translate }}</option>
          <option value="technology">Technology</option>
          <option value="healthcare">Healthcare</option>
          <option value="finance">Finance</option>
          <option value="education">Education</option>
          <option value="retail">Retail</option>
          <option value="manufacturing">Manufacturing</option>
          <option value="consulting">Consulting</option>
          <option value="media">Media & Entertainment</option>
          <option value="real-estate">Real Estate</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label for="district">{{ 'employer-db.account.districtLabel' | translate }}</label>
        <select id="district" name="team-size">
          <option value="">{{ 'employer-db.account.districtSelectPlaceholder' | translate }}</option>
          <option value="1-10">1-10 employees</option>
          <option value="11-50">11-50 employees</option>
          <option value="51-200">51-200 employees</option>
          <option value="201-500">201-500 employees</option>
          <option value="501-1000">501-1000 employees</option>
          <option value="1000+">1000+ employees</option>
        </select>
      </div>

      <div class="form-group">
        <label for="Commune">{{ 'employer-db.account.communeLabel' | translate }}</label>
        <select id="Commune" name="industry-types">
          <option value="">{{ 'employer-db.account.communeSelectPlaceholder' | translate }}</option>
          <option value="technology">Technology</option>
          <option value="healthcare">Healthcare</option>
          <option value="finance">Finance</option>
          <option value="education">Education</option>
          <option value="retail">Retail</option>
          <option value="manufacturing">Manufacturing</option>
          <option value="consulting">Consulting</option>
          <option value="media">Media & Entertainment</option>
          <option value="real-estate">Real Estate</option>
          <option value="other">Other</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label for="location">{{ 'employer-db.account.locationLabel' | translate }}</label>
      <input type="text" id="location" [placeholder]="'employer-db.account.locationLabel' | translate">
    </div>

    <div class="form-group">
      <label for="phone">{{ 'employer-db.account.phoneLabel' | translate }}</label>
      <div class="phone-wrapper">
        <div class="country-code">
          <div class="flag"></div>
          +89
        </div>
        <input type="text" id="phone" [placeholder]="'employer-db.account.phonePlaceholder' | translate">
      </div>
    </div>

    <div class="form-group">
      <label for="email">{{ 'employer-db.account.emailLabel' | translate }}</label>
      <div class="email-wrapper">
        <span class="email-icon">
          <i class="fas fa-envelope"></i>
        </span>
        <input type="email" id="email" [placeholder]="'employer-db.account.emailPlaceholder' | translate">
      </div>
    </div>

    <button class="btn btn-primary">
      {{ 'employer-db.account.saveChanges' | translate }}
    </button>
  </div>

  <!-- Change Password Section -->
  <form #changePasswordForm="ngForm" (ngSubmit)="onChangePassword()" class="section">
    <h2 class="section-title">{{ 'employer-db.account.changePasswordTitle' | translate }}</h2>

    <div class="password-grid">
      <div class="form-group">
        <label for="current-password">{{ 'employer-db.account.currentPasswordLabel' | translate }}</label>
        <div class="password-wrapper">
          <input
            type="password"
            id="current-password"
            [placeholder]="'employer-db.account.passwordPlaceholder' | translate"
            [(ngModel)]="oldPassword"
            name="oldPassword"
            required
          >
          <button type="button" class="password-toggle" (click)="togglePassword('current-password')">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="new-password">{{ 'employer-db.account.newPasswordLabel' | translate }}</label>
        <div class="password-wrapper">
          <input
            type="password"
            id="new-password"
            [placeholder]="'employer-db.account.passwordPlaceholder' | translate"
            [(ngModel)]="password"
            name="password"
            required
          >
          <button type="button" class="password-toggle" (click)="togglePassword('new-password')">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="confirm-password">{{ 'employer-db.account.confirmPasswordLabel' | translate }}</label>
        <div class="password-wrapper">
          <input
            type="password"
            id="confirm-password"
            [placeholder]="'employer-db.account.passwordPlaceholder' | translate"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            required
          >
          <button type="button" class="password-toggle" (click)="togglePassword('confirm-password')">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>
    </div>

    <button class="btn btn-primary" type="submit">
      {{ 'employer-db.account.changePasswordButton' | translate }}
    </button>
  </form>

  <!-- Delete Account Section -->
  <div class="section delete-section">
    <h2 class="section-title">{{ 'employer-db.account.deleteAccountTitle' | translate }}</h2>

    <div class="delete-warning">
      {{ 'employer-db.account.deleteWarning' | translate }}
    </div>

    <button class="close-account-btn">
      <span class="close-icon">
        <i class="fas fa-user-slash"></i>
      </span>
      {{ 'employer-db.account.deleteAccountButton' | translate }}
    </button>
  </div>
</div>

<div class="container">
  <!-- Contact Information Section -->
  <div class="section">
    <h2 class="section-title">Contact Information</h2>

    <div class="form-row three-columns">
      <div class="form-group">
        <label for="city">City</label>
        <select id="city" name="industry-types">
          <option value="">Select...</option>
          <option value="technology">Technology</option>
          <option value="healthcare">Healthcare</option>
          <option value="finance">Finance</option>
          <option value="education">Education</option>
          <option value="retail">Retail</option>
          <option value="manufacturing">Manufacturing</option>
          <option value="consulting">Consulting</option>
          <option value="media">Media & Entertainment</option>
          <option value="real-estate">Real Estate</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label for="district">District</label>
        <select id="district" name="team-size">
          <option value="">Select...</option>
          <option value="1-10">1-10 employees</option>
          <option value="11-50">11-50 employees</option>
          <option value="51-200">51-200 employees</option>
          <option value="201-500">201-500 employees</option>
          <option value="501-1000">501-1000 employees</option>
          <option value="1000+">1000+ employees</option>
        </select>
      </div>

      <div class="form-group">
        <label for="Commune">Commune</label>
        <select id="Commune" name="industry-types">
          <option value="">Select...</option>
          <option value="technology">Technology</option>
          <option value="healthcare">Healthcare</option>
          <option value="finance">Finance</option>
          <option value="education">Education</option>
          <option value="retail">Retail</option>
          <option value="manufacturing">Manufacturing</option>
          <option value="consulting">Consulting</option>
          <option value="media">Media & Entertainment</option>
          <option value="real-estate">Real Estate</option>
          <option value="other">Other</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label for="location">Map Location</label>
      <input type="text" id="location" placeholder="Enter location">
    </div>

    <div class="form-group">
      <label for="phone">Phone</label>
      <div class="phone-wrapper">
        <div class="country-code">
          <div class="flag"></div>
          +89
        </div>
        <input type="text" id="phone" placeholder="Phone number...">
      </div>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <div class="email-wrapper">
    <span class="email-icon">
      <i class="fas fa-envelope"></i>
    </span>
        <input type="email" id="email" placeholder="Email address">
      </div>
    </div>

    <button class="btn btn-primary">Save Changes</button>
  </div>

  <!-- Change Password Section -->
  <form #changePasswordForm="ngForm" (ngSubmit)="onChangePassword()" class="section">
    <h2 class="section-title">Change Password</h2>

    <div class="password-grid">
      <div class="form-group">
        <label for="current-password">Current Password</label>
        <div class="password-wrapper">
          <input type="password" id="current-password" placeholder="Password" [(ngModel)]="oldPassword" name="oldPassword" required>
          <button type="button" class="password-toggle" (click)="togglePassword('current-password')">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="new-password">New Password</label>
        <div class="password-wrapper">
          <input type="password" id="new-password" placeholder="Password" [(ngModel)]="password" name="password" required>
          <button type="button" class="password-toggle" (click)="togglePassword('new-password')">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="confirm-password">Confirm Password</label>
        <div class="password-wrapper">
          <input type="password" id="confirm-password" placeholder="Password" [(ngModel)]="confirmPassword" name="confirmPassword" required>
          <button type="button" class="password-toggle" (click)="togglePassword('confirm-password')">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>
    </div>

    <button class="btn btn-primary" type="submit">Change Password</button>
  </form>

  <!-- Delete Account Section -->
  <div class="section delete-section">
    <h2 class="section-title">Delete Your Company</h2>

    <div class="delete-warning">
      If you delete your Jobpilot account, you will no longer be able to get information about the matched jobs,
      following employers, and job alert, shortlisted jobs and more. You will be abandoned from all the services of
      Jobpilot.com
    </div>

    <button class="close-account-btn">
      <span class="close-icon">
        <i class="fas fa-user-slash"></i>
      </span>
      Close Account
    </button>
  </div>
</div>

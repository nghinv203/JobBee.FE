<div class="settings-header">
  <h1>{{ 'employer-db.settings.title' | translate }}</h1>

  <div class="tabs">
    <button (click)="onMessageCompany()" class="tab" [ngClass]="{ 'active': message === 'Company' }">
      <svg class="tab-icon" viewBox="0 0 24 24">
        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
      </svg>
      {{ 'employer-db.settings.tabs.company' | translate }}
    </button>

    <button (click)="onMessageFounding()" class="tab" [ngClass]="{ 'active': message === 'Founding' }">
      <svg class="tab-icon" viewBox="0 0 24 24">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
      </svg>
      {{ 'employer-db.settings.tabs.founding' | translate }}
    </button>

    <button (click)="onMessageSocial()" class="tab" [ngClass]="{ 'active': message === 'Social' }">
      <svg class="tab-icon" viewBox="0 0 24 24">
        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/>
      </svg>
      {{ 'employer-db.settings.tabs.social' | translate }}
    </button>

    <button (click)="onMessageAccount()" class="tab" [ngClass]="{ 'active': message === 'Account' }">
      <svg class="tab-icon" viewBox="0 0 24 24">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
      </svg>
      {{ 'employer-db.settings.tabs.account' | translate }}
    </button>
  </div>
</div>
